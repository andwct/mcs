# ── Image ─────────────────────────────────────────────────────────────────────
name: mcs-statefulset
fullnameOverride: mcs-statefulset-storage-mcs-statefulset
app: mcsservicename: mcs-service
replicaCount: 3
serviceAccountName: default
configMapName: mcs-configMapName
volumeMounts:
  - mountPath: /mnt/mcs
    name: mcs-statefulset-storage
  - mountPaht: /etc/config
    name: mcs-configMapName
  - mountPath: /root/mcs-secret
    name: mcs-secrets

#Container Configs
mcs:
  image: tcrtst.fart.dummy.com/devtest/mlp/mcs/mcs: {image tag}
  appModule: app.mcs.main:app
  resources:
    requests:
      cpu: "0.1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "16Gi"
  ports:
    - containerPort: 80
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
synchronizer:
  image: tcrtst.fart.dummy.com/devtest/mlp/mcs/mcs: {image tag}
  appModule: app.synchronizer.main:app
  resources:
    requests:
      cpu: "0.1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "16Gi"
  ports:
    - containerPort: 80
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
janitor:
  image: tcrtst.fart.dummy.com/devtest/mlp/mcs/mcs: {image tag}
  appModule: app.janitor.main:app
  resources:
    requests:
      cpu: "0.1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "16Gi"
  ports:
    - containerPort: 80
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30

###Individual replicas
service:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
      name: mcs-port
    - protocol: TCP
      port: 8081
      targetPort: 81
      name: synchronizer-port
    - protocol: TCP
      port: 8082
      targetPort: 82
      name: janitor-port

virtualService:
  gateways:
    - mlop-site-model-center-test-central-gateway
  mcsHostsPrefix: "mcs-mcs-replica"
  synchronizerHostPrefix: "mcs-synchronizer-replica"
  janitorHostPrefix: "mcs-janitor-replica"
  baseDomain: "mlop-site-model-center-test.ftest.dummy.com"

serviceLB:
  - name: mcs-service
    app: mcs
    ports:
      - protocol: TCP
        port: 8080
        targetPort: 80
        name: mcs-port-lb
      - protocol: TCP
        port: 8081
        targetPort: 81
        name: synchronizer-port-lb
      - protocol: TCP
        port: 8082
        targetPort: 82
        name: janitor-port-lb

virtualServiceLB:
  - name: mcs-mcs
    namespace: mlop-site-model-center
    gateways:
      - mlop-site-model-center-test-central-gateway
    hosts:
      - mcs-mcs-service.mlop-site-model-center-test.ftest.dummy.com
    http:
      - route:
        - destination:
            host: mcs-service.mlop-site-model-center.svc.cluster.local
            port: 8080
  - name: mcs-synchronizer
    namespace: mlop-site-model-center
    gateways:
      - mlop-site-model-center-test-central-gateway
    hosts:
      - mcs-synchronizer-service.mlop-site-model-center-test.ftest.dummy.com
    http:
      - route:
        - destination:
            host: mcs-service.mlop-site-model-center.svc.cluster.local
            port: 8081
  - name: mcs-janitor
    namespace: mlop-site-model-center
    gateways:
      - mlop-site-model-center-test-central-gateway
    hosts:
      - mcs-janitor-service.mlop-site-model-center-test.ftest.dummy.com
    http:
      - route:
        - destination:
            host: mcs-service.mlop-site-model-center.svc.cluster.local
            port: 8082

secret:
  - name: mcs-secrets
    path: kv-mlp/mlop-secret/mcs
    namespace: mlop-site-model-center
    releasename: mcs

configMap:
  namespace: mlop-site-model-center
  data:
    one.properties |
      STORAGE_PATH=/mnt/mcs
      LOG_LEVEL=INFO
      SITE_AUTHORIZATION_URL...
      SITE_ARTIFACT_SERVICE_URL...
      SITE_META_CACHE_SERVICE_URL...
      FART_NAME=
      STAGE_NAME=SIT
    
    ABC.json |
      {
        "PRODUCT_ID": "productID_ABC",
        "PRODUCT_NAME": "ABC",
        "ENABLE_VAULT": true,
        "MODEL_CENTER_ACCOUNT": "ABC",
        "MODEL_CENTER_PASSWORD": "",
        "FUNCTION_LIST": "123, 456",
        "FUNCTION_NAME_MAPPING": {
          "funcID_123":"funcName_123", 
          "funcID_456": "funcName_456"
        }
      }
persistence:
  size: "10Gi"
zonalStorageClass:
  enabled: true
  prefix: "netapp-san-ssd-dc"
pvcName: mcs-statefulset-storage
