# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: your-registry/mcs
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 3

# ── NATS ──────────────────────────────────────────────────────────────────────
# Stream names must match streams pre-created in siteMC NATS by platform team.
nats:
  url: "nats://sitemc-nats:4222"
  credsSecretName: "mcs-nats-creds"   # K8s secret containing nats.creds (from Vault VSO)
  credsKey: "nats.creds"
  streams:
    artifact: "MLOP-MCS-ARTIFACT"     # deployer fills this in
    metadata: "MLOP-MCS-METADATA"     # deployer fills this in
  ackWait:
    artifactSeconds: 300
    metadataSeconds: 30

# ── Redis Sentinel (Bitnami chart 18.2.0 / Redis 7.2.4) ──────────────────────
redis:
  sentinel:
    hosts: "mcs-redis-headless"       # Bitnami headless service name
    port: 26379
    masterName: "mymaster"
  passwordSecretName: "mcs-redis-secret"
  passwordKey: "password"
  modelListKey: "mcs:model_list"

# ── siteMC HTTP services ──────────────────────────────────────────────────────
siteMC:
  artifactServiceUrl: "http://artifact-cache-service"
  metaCacheServiceUrl: "http://meta-cache-service"

# ── Auth (Basic Auth for MCS ↔ siteMC + clients ↔ MCS) ───────────────────────
auth:
  secretName: "mcs-auth-secret"

# ── Storage (PVC per pod) ─────────────────────────────────────────────────────
storage:
  mountPath: "/mnt/models"
  storageClassName: "standard"
  size: "50Gi"

# ── ConfigMap (product configs) ───────────────────────────────────────────────
config:
  mountPath: "/etc/config"

# ── Janitor ───────────────────────────────────────────────────────────────────
janitor:
  intervalSeconds: 300
  highWatermark: "0.90"
  lowWatermark: "0.75"

# ── Container ports ───────────────────────────────────────────────────────────
ports:
  mcs: 8080
  synchronizer: 8081
  janitor: 8082

# ── Probes ────────────────────────────────────────────────────────────────────
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10

# ── Logging ───────────────────────────────────────────────────────────────────
logLevel: "INFO"
