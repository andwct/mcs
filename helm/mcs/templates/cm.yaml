# ── Env ConfigMap ─────────────────────────────────────────────────────────────
# Single source of truth (.Values.envConfig). Populates core/config/settings.py
# via envFrom in all 3 containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcs.envConfigMapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcs.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.envConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

---
# ── Product Config ConfigMap ──────────────────────────────────────────────────
# Mounted as a volume at envConfig.CONFIGMAP_MOUNT_PATH (/etc/config).
# - one.properties is auto-generated from .Values.envConfig (same source as
#   the env ConfigMap above) — no duplication.
# - One JSON file per product, parsed by core/k8s/configmap.py
#   (load_one_properties, load_product_configs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcs.productConfigMapName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcs.labels" . | nindent 4 }}
data:
  {{ .Values.envConfig.CONFIGMAP_ONE_PROPERTIES }}: |
    {{- range $key, $value := .Values.envConfig }}
    {{ $key }}={{ $value }}
    {{- end }}
  {{- range $filename, $content := .Values.productConfig.products }}
  {{ $filename }}: |
{{ $content | indent 4 }}
  {{- end }}
