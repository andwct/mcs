# ── ConfigMap ─────────────────────────────────────────────────────────────
# Single ConfigMap containing one.properties (env config, key=value format,
# parsed by core/k8s/configmap.py:load_one_properties() + bootstrap.py)
# and one JSON file per product (e.g. ABC.json), loaded by
# core/k8s/configmap.py:load_product_configs().
# Mounted as a volume at /etc/config in all 3 containers (see sts.yaml
# volumeMounts -> .Values.volumeMounts).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMapName }}
  namespace: {{ .Values.configMap.namespace }}
  labels:
    app: {{ .Values.app }}
data:
  {{- .Values.configMap.data | toYaml | nindent 2 }}
