apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.configMap.namespace }}
  labels:
    app: {{ .Values.app }}
spec:
  serviceName: {{ .Values.serviceName }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.app }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:

        # ── mcs (FastAPI serving) ─────────────────────────────────────────
        - name: mcs
          image: "{{ .Values.mcs.image }}:{{ .Values.mcs.tag }}"
          command:
            - uvicorn
            - {{ .Values.mcs.appModule }}
            - --host
            - "0.0.0.0"
            - --port
            - "{{ (index .Values.mcs.ports 0).containerPort }}"
          ports:
            {{- toYaml .Values.mcs.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.mcs.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.mcs.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.mcs.livenessProbe | nindent 12 }}

        # ── synchronizer (NATS consumer) ─────────────────────────────────
        - name: synchronizer
          image: "{{ .Values.synchronizer.image }}:{{ .Values.synchronizer.tag }}"
          command:
            - uvicorn
            - {{ .Values.synchronizer.appModule }}
            - --host
            - "0.0.0.0"
            - --port
            - "{{ (index .Values.synchronizer.ports 0).containerPort }}"
          ports:
            {{- toYaml .Values.synchronizer.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.synchronizer.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.synchronizer.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.synchronizer.livenessProbe | nindent 12 }}

        # ── janitor (PVC eviction) ────────────────────────────────────────
        - name: janitor
          image: "{{ .Values.janitor.image }}:{{ .Values.janitor.tag }}"
          command:
            - uvicorn
            - {{ .Values.janitor.appModule }}
            - --host
            - "0.0.0.0"
            - --port
            - "{{ (index .Values.janitor.ports 0).containerPort }}"
          ports:
            {{- toYaml .Values.janitor.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.janitor.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.janitor.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.janitor.livenessProbe | nindent 12 }}

      volumes:
        - name: mcs-statefulset-storage
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
        - name: mcs-configMapName
          configMap:
            name: {{ .Values.configMapName }}
        - name: mcs-secrets
          secret:
            secretName: {{ (index .Values.secret 0).name }}
