# Secret synced from internal Vault at .Values.secret.vaultPath
# Expected keys (configurable via values.yaml -> secret.*Key):
#   nats.creds              — NATS decentralized auth credentials file
#   redis-password          — Redis Sentinel auth password
#   model-center-account    — Basic Auth username (MCS <-> siteMC, clients <-> MCS)
#   model-center-password   — Basic Auth password
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcs.labels" . | nindent 4 }}
spec:
  type: kv-v2
  mount: kv-mlp
  path: {{ .Values.secret.vaultPath }}
  destination:
    name: {{ .Values.secret.name }}
    create: true
  refreshAfter: 1h
