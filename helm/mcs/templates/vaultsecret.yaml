# Secrets synced from internal Vault via the ricoberger/vault-secrets-operator
# (ricoberger.de/v1alpha1, kind: VaultSecret).
#
# Each entry in .Values.secret creates one VaultSecret resource, which syncs
# ALL keys found at `path` into a K8s Secret named `name`, mounted as a
# volume at /root/mcs-secret in all 3 containers (see sts.yaml volumeMounts).
#
# Typical keys synced:
#   nats.creds                          — NATS decentralized auth credentials file
#   {PRODUCT_NAME}_MODEL_CENTER_PASSWORD — Basic Auth password (MCS <-> siteMC,
#                                          loaded directly from file by
#                                          core/k8s/configmap.py, not env var)
#   ENCRYPTION_KEY                       — partial encryption key (Phase 2)
{{- range .Values.secret }}
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-namespace: {{ .namespace }}
    meta.helm.sh/release-name: {{ .releasename }}
spec:
  path: {{ .path }}
  type: Opaque
{{- end }}
