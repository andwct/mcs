# Secrets synced from internal Vault via the ricoberger/vault-secrets-operator
# (ricoberger.de/v1alpha1, kind: VaultSecret).
#
# Each entry in .Values.vaultSecrets creates one VaultSecret resource, which
# syncs ALL keys found at `path` into a K8s Secret named `name`.
#
# Typical keys synced:
#   nats.creds              — NATS decentralized auth credentials file
#   redis-password          — Redis Sentinel auth password
#   model-center-account    — Basic Auth username (MCS <-> siteMC, clients <-> MCS)
#   model-center-password   — Basic Auth password
{{- range .Values.vaultSecrets }}
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-namespace: {{ .namespace }}
    meta.helm.sh/release-name: {{ .releasename }}
spec:
  path: {{ .path }}
  type: Opaque
{{- end }}
