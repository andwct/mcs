{{- range .Values.virtualServiceLB }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app: {{ $.Values.app }}
spec:
  gateways:
    {{- toYaml .gateways | nindent 4 }}
  hosts:
    {{- toYaml .hosts | nindent 4 }}
  http:
    {{- toYaml .http | nindent 4 }}
{{- end }}
