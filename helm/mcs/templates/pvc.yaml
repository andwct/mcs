{{- /*
Static PVC matching the StatefulSet's volumeMounts (mcs-statefulset-storage).
Current values.yaml uses a single shared PVC (pvcName) rather than
per-ordinal StatefulSet volumeClaimTemplates, since storage.mountPath
in containers references a fixed volume name "mcs-statefulset-storage".
*/ -}}
{{- if .Values.zonalStorageClass.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvcName }}
  namespace: {{ .Values.configMap.namespace }}
  labels:
    app: {{ .Values.app }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ printf "%s1" .Values.zonalStorageClass.prefix }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
